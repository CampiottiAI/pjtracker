[project]
name = "pjtracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "ipykernel>=7.2.0",
    "openai>=2.26.0",
    "opencv-contrib-python>=4.13.0.92",
    "pdf2image>=1.17.0",
    "plotly>=5.24.0",
    "pydantic>=2.12.5",
    "pypdf>=6.7.4",
    "rich>=14.3.3",
    "st-img-pastebutton>=0.0.6",
    "streamlit>=1.54.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
